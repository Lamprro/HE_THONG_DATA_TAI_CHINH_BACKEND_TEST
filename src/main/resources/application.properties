spring.application.name=financial-data-api
server.port=8080

# Local database credentials are loaded from application-local.properties.
# This file is intentionally safe to commit.
spring.config.import=optional:file:./application-local.properties

# Existing PostgreSQL schema is managed outside Hibernate in the current phase.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Scheduler is opt-in until jobs are reviewed and activated deliberately.
financial.ingestion.scheduler.enabled=false
financial.ingestion.scheduler.poll-interval=60000

# The catalog is seeded only when explicitly enabled for a controlled deployment/run.
financial.ingestion.catalog.seed-enabled=false

# Master security job synchronization is immediate on admin writes. This periodic reconciliation is opt-in.
financial.security-job-reconciliation.scheduler.enabled=false
financial.security-job-reconciliation.scheduler.poll-interval=86400000

# Seed 10 reviewed company/security records only when explicitly requested on the command line.
financial.master-data.catalog.seed-enabled=false
