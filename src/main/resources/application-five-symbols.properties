# Controlled local automatic pipeline for FPT, ACB, BID, HPG and VCB.
# Start with --spring.profiles.active=local,five-symbols. The default profile
# remains opt-in because the shared DB contains many unrelated active jobs.
financial.ingestion.scheduler.enabled=true
financial.validation.scheduler.enabled=true
financial.validation.scheduler.allowed-symbols=FPT,ACB,BID,HPG,VCB,VNINDEX,VN30,HNXINDEX
financial.ingestion.scheduler.allowed-job-codes=MARKET_PRICE_BUILD,FINANCIAL_STATEMENT_BUILD,INDEX_PRICE_BUILD,NEWS_ARTICLE_BUILD,NEWS_DATA_FETCH,VNSTOCK_VNINDEX_INDEX_OHLCV_DAILY,VNSTOCK_VN30_INDEX_OHLCV_DAILY,VNSTOCK_HNXINDEX_INDEX_OHLCV_DAILY,VNDIRECT_FPT_OHLCV_DAILY,VNDIRECT_FPT_QUOTE_15M,VNDIRECT_FPT_BALANCE_SHEET_WEEKLY,VNDIRECT_FPT_CASH_FLOW_WEEKLY,VNDIRECT_FPT_INCOME_STATEMENT_WEEKLY,CAFEF_FPT_NEWS_30M,VNDIRECT_ACB_OHLCV_DAILY,VNDIRECT_ACB_QUOTE_15M,VNDIRECT_ACB_BALANCE_SHEET_WEEKLY,VNDIRECT_ACB_CASH_FLOW_WEEKLY,VNDIRECT_ACB_INCOME_STATEMENT_WEEKLY,CAFEF_ACB_NEWS_30M,VNDIRECT_BID_OHLCV_DAILY,VNDIRECT_BID_QUOTE_15M,VNDIRECT_BID_BALANCE_SHEET_WEEKLY,VNDIRECT_BID_CASH_FLOW_WEEKLY,VNDIRECT_BID_INCOME_STATEMENT_WEEKLY,CAFEF_BID_NEWS_30M,VNDIRECT_HPG_OHLCV_DAILY,VNDIRECT_HPG_QUOTE_15M,VNDIRECT_HPG_BALANCE_SHEET_WEEKLY,VNDIRECT_HPG_CASH_FLOW_WEEKLY,VNDIRECT_HPG_INCOME_STATEMENT_WEEKLY,CAFEF_HPG_NEWS_30M,VNDIRECT_VCB_OHLCV_DAILY,VNDIRECT_VCB_QUOTE_15M,VNDIRECT_VCB_BALANCE_SHEET_WEEKLY,VNDIRECT_VCB_CASH_FLOW_WEEKLY,VNDIRECT_VCB_INCOME_STATEMENT_WEEKLY,CAFEF_VCB_NEWS_30M
