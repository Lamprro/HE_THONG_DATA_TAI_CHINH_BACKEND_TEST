name: Deploy Spring Boot

on:
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: true

jobs:
  deploy:
    # Merging code must not deploy an unreviewed runtime or run manual DB migrations.
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        env:
          FINANCIAL_JWT_SECRET: ${{ secrets.FINANCIAL_JWT_SECRET }}
          FINANCIAL_ADMIN_SMOKE_USERNAME: ${{ secrets.FINANCIAL_ADMIN_SMOKE_USERNAME }}
          FINANCIAL_ADMIN_SMOKE_PASSWORD: ${{ secrets.FINANCIAL_ADMIN_SMOKE_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, binascii, os
          try:
              key = base64.b64decode(os.environ["FINANCIAL_JWT_SECRET"], validate=True)
          except (ValueError, binascii.Error):
              key = b""
          if len(key) < 32 or not all(os.environ.get(name) for name in
                  ("FINANCIAL_ADMIN_SMOKE_USERNAME", "FINANCIAL_ADMIN_SMOKE_PASSWORD")):
              raise SystemExit("Configure JWT signing key and Admin smoke account secrets.")
          PY
          # Keep the server's Docker/Maven cache between deployments.
          # The changed service is recreated by compose without taking the
          # whole project down first.
          docker compose build --build-arg APP_BUILD_COMMIT="$GITHUB_SHA"
          docker compose up -d --remove-orphans

          # Fail the workflow if the newly started API never becomes healthy.
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8080/api/health | grep -q "$GITHUB_SHA"; then
              echo "Backend health check passed."
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose logs --tail=120 app
              exit 1
            fi
            sleep 2
          done

          python3 - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          from urllib.error import URLError
          base = "http://127.0.0.1:8080"
          credentials = json.dumps({
              "username": os.environ["FINANCIAL_ADMIN_SMOKE_USERNAME"],
              "password": os.environ["FINANCIAL_ADMIN_SMOKE_PASSWORD"],
          }).encode()
          try:
              login = Request(base + "/api/auth/login", data=credentials, headers={"Content-Type": "application/json"})
              with urlopen(login, timeout=15) as response:
                  token = json.load(response)["accessToken"]
              coverage = Request(base + "/api/admin/financial-data/quality/coverage",
                  headers={"Authorization": "Bearer " + token})
              with urlopen(coverage, timeout=20):
                  print("Admin JWT smoke check passed.")
          except (URLError, ValueError, KeyError):
              raise SystemExit("Admin JWT smoke check failed. Verify the DB account and role.")
          PY

          # Remove only dangling layers; keep tagged images for rollback.
          docker image prune --force

      - name: Show deployed containers
        if: always()
        env:
          FINANCIAL_JWT_SECRET: ${{ secrets.FINANCIAL_JWT_SECRET }}
        run: docker compose ps
