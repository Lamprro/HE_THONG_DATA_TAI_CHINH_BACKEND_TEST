name: Deploy Spring Boot

on:
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: true

jobs:
  deploy:
    # Merging code must not deploy an unreviewed runtime or run manual DB migrations.
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        env:
          FINANCIAL_JWT_SECRET: ${{ secrets.FINANCIAL_JWT_SECRET }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          key = os.environ["FINANCIAL_JWT_SECRET"]
          if not key.strip() or len(key.encode("utf-8")) < 32:
              raise SystemExit("FINANCIAL_JWT_SECRET needs at least 32 UTF-8 bytes.")
          PY
          # Keep the server's Docker/Maven cache between deployments.
          # The changed service is recreated by compose without taking the
          # whole project down first.
          docker compose build --build-arg APP_BUILD_COMMIT="$GITHUB_SHA"
          docker compose up -d --remove-orphans

          # Fail the workflow if the newly started API never becomes healthy.
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8080/api/health | grep -q "$GITHUB_SHA"; then
              echo "Backend health check passed."
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose logs --tail=120 app
              exit 1
            fi
            sleep 2
          done

          # Successful login is covered by the Backend tests workflow with fixture credentials.
          login_status=$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' \
            --header 'Content-Type: application/json' --data '{}' http://127.0.0.1:8080/api/auth/login)
          admin_status=$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8080/api/admin/console/session)
          if [ "$login_status" != 400 ] || [ "$admin_status" != 401 ]; then
            echo "Unexpected login or Admin access status."
            exit 1
          fi

          # Remove only dangling layers; keep tagged images for rollback.
          docker image prune --force

      - name: Show deployed containers
        if: always()
        env:
          FINANCIAL_JWT_SECRET: ${{ secrets.FINANCIAL_JWT_SECRET }}
        run: docker compose ps
