services:
  app:
    build: .
    container_name: springboot-app
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - /home/mai-van-nam/app-config/.env
    environment:
      FINANCIAL_ADMIN_API_TOKEN: ${FINANCIAL_ADMIN_API_TOKEN:?Dedicated admin credential is required for deployment}
    mem_limit: 768m
    mem_reservation: 256m
    cpus: "1.50"
    restart: always
