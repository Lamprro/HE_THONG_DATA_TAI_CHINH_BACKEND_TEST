services:
  app:
    build: .
    container_name: springboot-app
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - /home/mai-van-nam/app-config/.env
    environment:
      FINANCIAL_JWT_SECRET: ${FINANCIAL_JWT_SECRET:?JWT signing key is required for deployment}
    mem_limit: 768m
    mem_reservation: 256m
    cpus: "1.50"
    restart: always
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always", "--maxmemory-policy", "noeviction"]
    volumes:
      - financial_data_redis:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  financial_data_redis:
