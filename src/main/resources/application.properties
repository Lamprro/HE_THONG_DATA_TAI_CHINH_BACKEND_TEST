spring.application.name=financial-data-api
server.port=8080

# Browser clients allowed to call the REST API. Override with a comma-separated
# APP_CORS_ALLOWED_ORIGINS value in deployed environments when needed.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://*.vercel.app}

# Local database credentials are loaded from application-local.properties.
# This file is intentionally safe to commit.
spring.config.import=optional:file:./application-local.properties

# Existing PostgreSQL schema is managed outside Hibernate in the current phase.
# The shared PostgreSQL schema is externally managed; application startup must never mutate it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Scheduler is opt-in until jobs are reviewed and activated deliberately.
financial.ingestion.scheduler.enabled=false
financial.ingestion.scheduler.poll-interval=60000
financial.macro.scheduler.enabled=false
financial.macro.scheduler.poll-interval=60000
# Collection and validation use separate scheduling threads so a slow provider
# does not block validation of already-fetched raw payloads.
spring.task.scheduling.pool.size=2
# Optional comma-separated allowlist for controlled local runs; blank means all active jobs.
financial.ingestion.scheduler.allowed-job-codes=

# Phase 2 validation is explicitly enabled by an admin request or opt-in scheduler.
financial.validation.catalog.seed-enabled=false
financial.validation.scheduler.enabled=false
financial.validation.scheduler.poll-interval=60000
# Optional comma-separated validation scope for controlled local runs.
financial.validation.scheduler.allowed-symbols=

# The catalog is seeded only when explicitly enabled for a controlled deployment/run.
financial.ingestion.catalog.seed-enabled=false

# Master security job synchronization is immediate on admin writes. This periodic reconciliation is opt-in.
financial.security-job-reconciliation.scheduler.enabled=false
financial.security-job-reconciliation.scheduler.poll-interval=86400000

# Seed 10 reviewed company/security records only when explicitly requested on the command line.
financial.master-data.catalog.seed-enabled=false

# Dedicated local Redis container: financial-data-redis on host port 6380.
spring.data.redis.host=localhost
spring.data.redis.port=6380
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
spring.data.redis.repositories.enabled=false
financial.ingestion.retry-budget.key-prefix=financial-data:ingestion:retry-budget:
financial.ingestion.retry-budget.ttl=30d
financial.ingestion.retry-budget.initialize-enabled=false

spring.profiles.active=local

# LLM is opt-in. Missing credentials never create an artificial AI result.
financial.llm.enabled=${LLM_ENABLED:false}
financial.llm.gemini.api-key=${GEMINI_API_KEY:}
financial.llm.gemini.model=${GEMINI_MODEL:}
financial.llm.gemini.models=${GEMINI_MODELS:gemini-3.5-flash-lite,gemini-3.5-flash,gemini-3.8-flash,gemini-3.1-flash-lite,gemini-3.6-flash,gemini-3.7-flash,gemini-2.5-flash,gemini-2.5-flash-lite}
financial.llm.gemini.max-attempts=${GEMINI_MAX_ATTEMPTS:8}
financial.llm.gemini.max-attempts-per-model=${GEMINI_MAX_ATTEMPTS_PER_MODEL:1}
financial.llm.gemini.attempt-timeout-ms=${GEMINI_ATTEMPT_TIMEOUT_MS:45000}
financial.llm.gemini.total-timeout-ms=${GEMINI_TOTAL_TIMEOUT_MS:180000}
financial.llm.gemini.backoff-ms=${GEMINI_BACKOFF_MS:1000}
financial.llm.gemini.max-backoff-ms=${GEMINI_MAX_BACKOFF_MS:8000}
financial.llm.gemini.cooldown-ms=${GEMINI_COOLDOWN_MS:60000}
financial.llm.gemini.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:16384}
financial.llm.gemini.thinking-budget=${GEMINI_THINKING_BUDGET:1024}
financial.llm.catalog.seed-enabled=false
financial.admin.api-token=${FINANCIAL_ADMIN_API_TOKEN:}
financial.llm.scheduler.enabled=false
financial.llm.scheduler.delay-ms=300000

# ==========================================
# Logging Configuration for Server & Development
# ==========================================
logging.file.path=./logs
logging.level.root=INFO
logging.level.com.hethongdata.taichinh=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# Document storage. Enabling storage does not start the separate opt-in recovery scheduler.
# Supply secrets through environment variables or the gitignored local properties file.
financial.documents.cloudinary.enabled=${CLOUDINARY_DOCUMENTS_ENABLED:false}
financial.documents.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
financial.documents.cloudinary.api-key=${CLOUDINARY_API_KEY:}
financial.documents.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
financial.documents.cloudinary.folder=${CLOUDINARY_DOCUMENT_FOLDER:financial/news-documents}
financial.documents.cloudinary.max-file-bytes=${CLOUDINARY_MAX_FILE_BYTES:20971520}
financial.documents.cloudinary.connect-timeout=${CLOUDINARY_CONNECT_TIMEOUT:5s}
financial.documents.cloudinary.read-timeout=${CLOUDINARY_READ_TIMEOUT:45s}
financial.news-recovery.scheduler.enabled=${NEWS_RECOVERY_SCHEDULER_ENABLED:false}
financial.news-recovery.scheduler.delay-ms=300000
