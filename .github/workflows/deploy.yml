name: Deploy Spring Boot

on:
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: true

jobs:
  deploy:
    # Merging code must not deploy an unreviewed runtime or run manual DB migrations.
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        env:
          FINANCIAL_ADMIN_API_TOKEN: ${{ secrets.FINANCIAL_ADMIN_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${#FINANCIAL_ADMIN_API_TOKEN}" -lt 32 ]; then
            echo "Dedicated admin credential must be configured in deployment secrets."
            exit 1
          fi
          # Keep the server's Docker/Maven cache between deployments.
          # The changed service is recreated by compose without taking the
          # whole project down first.
          docker compose build --build-arg APP_BUILD_COMMIT="$GITHUB_SHA"
          docker compose up -d --remove-orphans

          # Fail the workflow if the newly started API never becomes healthy.
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8080/api/health | grep -q "$GITHUB_SHA"; then
              echo "Backend health check passed."
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose logs --tail=120 app
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent --show-error --max-time 20 --output /dev/null \
            --header "Authorization: Bearer ${FINANCIAL_ADMIN_API_TOKEN}" \
            http://127.0.0.1:8080/api/admin/financial-data/quality/coverage

          # Remove only dangling layers; keep tagged images for rollback.
          docker image prune --force

      - name: Show deployed containers
        if: always()
        env:
          FINANCIAL_ADMIN_API_TOKEN: ${{ secrets.FINANCIAL_ADMIN_API_TOKEN }}
        run: docker compose ps
