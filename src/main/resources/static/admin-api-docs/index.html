<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API quản trị · Swagger UI</title>
  <link rel="stylesheet" href="/webjars/swagger-ui/5.34.0/swagger-ui.css">
  <script src="/webjars/swagger-ui/5.34.0/swagger-ui-bundle.js" defer></script>
  <script src="/admin-api-docs/console.js" defer></script>
</head>
<body>
  <form id="connect-docs">
    <label>Tên đăng nhập <input id="admin-username" autocomplete="username" required maxlength="100"></label>
    <label>Mật khẩu <input id="admin-password" type="password" autocomplete="current-password" required maxlength="72"></label>
    <button type="submit">Mở tài liệu API</button>
    <button id="clear-docs" type="button">Ngắt kết nối</button>
  </form>
  <p id="docs-status" role="status">Bạn có thể thử API đọc ở đây. Dùng màn quản trị để thực hiện thay đổi dữ liệu.</p>
  <div id="swagger-ui"></div>
</body>
</html>
